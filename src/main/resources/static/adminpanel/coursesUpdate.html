<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redaktə et</title>
    <link rel="stylesheet" href="./events.css">
</head>

<body>
    <form id="update-form">
        <label for="title">Başlıq</label>
        <input required type="text" name="title" id="title">
        <label for="about">Haqqında</label>
        <textarea required name="about" id="about"></textarea>
        <label for="teacherFirstName">Müəllimin adı</label>
        <input required type="text" name="teacherFirstName" id="teacherFirstName">
        <label for="teacherLastName">Müəllimin soyadı</label>
        <input required type="text" name="teacherLastName" id="teacherLastName">
        <label for="teacherAbout">Müəllim haqqında</label>
        <textarea required name="teacherAbout" id="teacherAbout"></textarea>
        <button>Redaktə et</button>
    </form>
    <form id="image-form">
        <div class="course">

        </div>
        <div class="teacher">

        </div>
    </form>
    <script>
        let form = document.querySelector("#update-form");
        let titleInput = form.querySelector("#title");
        let aboutInput = form.querySelector("#about");
        let teacherFirstNameInput = form.querySelector("#teacherFirstName")
        let teacherLastNameInput = form.querySelector("#teacherLastName");
        let teacherAboutInput = form.querySelector("#teacherAbout");
        let imageForm = document.querySelector("#image-form");


        form.addEventListener("submit", e => {
            e.preventDefault();
            let data = {
                title: titleInput.value,
                about: aboutInput.value,
                teacherFirstName: teacherFirstNameInput.value,
                teacherLastName: teacherLastNameInput.value,
                teacherAbout: teacherAboutInput.value
            }
            updateCourse(data);
            submitImageForm();
            window.location.href = "/adminpanel/courses.html";
        })

        function submitImageForm() {
            let courseInput = imageForm.querySelector(".course input");
            let teacherInput = imageForm.querySelector(".teacher input");

            if (courseInput.files && courseInput.files[0]) {
                const courseImageFile = courseInput.files[0];
                const courseFormData = new FormData();
                courseFormData.append("image", courseImageFile);
                fetch(`/api/courses/${getCourseId()}/image`, {
                    method: "POST",
                    headers: {
                        "Authorization": "Bearer " + localStorage.getItem("zmmtoken")
                    },
                    body: courseFormData
                })
                    .then(r => {
                        if (r.status != 200) {
                            alert("Şəkil yüklənmədi");
                        }
                    })
            }

            if (teacherInput.files && teacherInput.files[0]) {
                const teacherImageFile = teacherInput.files[0];
                const teacherFormData = new FormData();
                teacherFormData.append("image", teacherImageFile);
                fetch(`/api/courses/${getCourseId()}/teacher/image`, {
                    method: "POST",
                    headers: {
                        "Authorization": "Bearer " + localStorage.getItem("zmmtoken")
                    },
                    body: teacherFormData
                })
                    .then(r => {
                        if (r.status != 200) {
                            alert("Şəkil yüklənmədi");
                        }
                    })
            }
        }

        function connectInputToImg(input, img, defaultUrl) {
            input.addEventListener('change', () => {
                const file = input.files && input.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = e => {
                        img.src = e.target.result;
                    }
                    reader.readAsDataURL(file);
                }
                else {
                    img.src = defaultUrl;
                }
            })
        }

        function loadImageForm() {
            let course = imageForm.querySelector(".course");
            let teacher = imageForm.querySelector(".teacher");
            let courseInput = document.createElement("input");
            course.appendChild(courseInput);
            let courseImg = document.createElement("img");
            course.appendChild(courseImg);
            courseInput.type = "file";

            let teacherInput = document.createElement("input");
            teacher.appendChild(teacherInput);
            let teacherImg = document.createElement("img");
            teacher.appendChild(teacherImg);
            teacherInput.type = "file";

            getCourse(getCourseId())
                .then(course => {
                    if (course.imageUrl == null) course.imageUrl = "";
                    if (course.teacherImageUrl == null) course.teacherImageUrl = "";
                    courseImg.src = course.imageUrl;
                    teacherImg.src = course.teacherImageUrl;
                    connectInputToImg(courseInput, courseImg, course.imageUrl);
                    connectInputToImg(teacherInput, teacherImg, course.teacherImageUrl);
                    console.log(course);
                })


        }

        function updateCourse(course) {
            return fetch(`/api/courses/${getCourseId()}`, {
                method: 'PUT',
                headers: {
                    "Authorization": "Bearer " + localStorage.getItem("zmmtoken"),
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(course)
            })
        }

        function getUser() {
            return fetch("/api/auth/user", {
                method: 'POST',
                headers: {
                    "Authorization": "Bearer " + localStorage.getItem("zmmtoken")
                }
            })
        }

        function getCourse(id) {
            if (typeof id !== "number" || isNaN(id)) {
                alert("Kurs ID tapılmadı");
                throw Error();
            }
            return fetch(`/api/courses/${id}`)
                .then(r => {
                    if (r.status != 200) {
                        throw Error();
                    }

                    return r.json();
                });
        }

        function injectData(data) {

            titleInput.value = data.title;
            aboutInput.value = data.about;
            teacherFirstNameInput.value = data.teacherFirstName;
            teacherLastNameInput.value = data.teacherLastName;
            teacherAboutInput.value = data.teacherAbout;
        }

        function getCourseId() {
            return Number(localStorage.getItem("currentCourseId"));
        }

        function loadPage() {
            getUser()
                .then(r => {
                    if (r.status != 200) {
                        throw Error();
                    }

                    return r.json();
                })
                .then(data => {
                    if (data.role != 'ADMIN') throw Error();
                })
                .catch(() => window.location.href = "/adminpanel/login.html");
            getCourse(getCourseId())
                .then(course => injectData(course))
                .catch(() => alert("Xəta: Kurs yüklənmədi!"));
            loadImageForm();
        }

        loadPage();
    </script>
</body>

</html>
